<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · MSP local</title>
  <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
<header><a class="brand" href="/dashboard">MSP <span>local</span></a><span class="badge">Protótipo educacional</span></header>
<main class="account"><p class="eyebrow">Assinatura multipartidária</p><h1>Entre na sua conta</h1>
<p>Um espaço local para experimentar o fluxo de assinatura MSP.</p>
<p class="message" role="status">{{message}}</p>
<form action="/login" method="post">
<label for="email">Email</label><input id="email" name="email" type="email" maxlength="254" autocomplete="username" required>
<label for="password">Senha</label><input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
<button type="submit">Entrar</button></form>
<p>Primeiro acesso? <a href="/register">Criar uma conta</a></p></main>
<footer>HTTP local · Dados temporários em memória · CMS com três assinantes</footer>
</body>
</html>
